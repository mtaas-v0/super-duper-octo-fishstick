name: Build libmagic arm64-windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-libmagic:
    env:
      ACTIONS_CACHE_URL: ${{ secrets.ACTIONS_CACHE_URL }} # Or handled automatically by the setup action
      ACTIONS_RUNTIME_TOKEN: ${{ secrets.ACTIONS_RUNTIME_TOKEN }}
      
    runs-on: windows-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ runner.workspace }}/vcpkg
          #vcpkgGitCommitId: master
          # Replace this with the actual full 40-character SHA-1 hash you want to use
          vcpkgGitCommitId: '0bc1a55f422ceb190877234b3ba88c372f04c485' 
    

      - name: Install libmagic for arm64-windows
        shell: pwsh
        run: |
          & "${{ env.VCPKG_ROOT }}/vcpkg.exe" install libmagic:arm64-windows --triplet arm64-windows

      - name: Find the built DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem "${{ env.VCPKG_ROOT }}/installed/arm64-windows/bin" -Filter *.dll -Recurse | Select-Object -First 1
          if (-not $dll) {
            throw "No DLL was produced for libmagic:arm64-windows"
          }

          New-Item -ItemType Directory -Force -Path .artifact | Out-Null
          Copy-Item $dll.FullName -Destination .artifact/

      - name: Upload libmagic DLL as artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmagic-arm64-windows-dll
          path: ${{ env.VCPKG_ROOT }}\packages\libmagic_arm64-windows
          if-no-files-found: error
